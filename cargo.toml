cat > /home/claude/venom-forge/Cargo.toml << 'EOF'
[package]
name = "venom-forge"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "venom-forge"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["blocking", "cookies", "gzip", "deflate", "json", "rustls-tls"], default-features = false }
clap = { version = "4", features = ["derive"] }
scraper = "0.18"
url = "2"
regex = "1"
colored = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
base64 = "0.21"
chrono = "0.4"
indicatif = "0.17"
dialoguer = "0.11"
console = "0.15"
EOF
echo "done"